name: Publish to npm

# Release-driven publishing: create a GitHub Release (or push a v* tag) and this
# workflow publishes the package with provenance.
#
# Authentication is npm *trusted publishing* (OIDC): no token, no OTP. It needs
# two things set up once, by hand:
#   1. the package exists (first publish done interactively with --otp);
#   2. npmjs.com → package → Settings → Trusted publishing → GitHub Actions,
#      with repository smithtomge-alt/dsh-shortcuts-prompt and workflow
#      publish.yml.
# Bypass-2FA granular tokens are being retired for direct publish, so a secret is
# deliberately not used here.

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish --dry-run instead of publishing'
        type: boolean
        default: true

permissions:
  contents: write # temporary: a failed publish pushes its log to ci-diagnostics
  id-token: write # npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url: that writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc,
      # which conflicts with the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Guard: the tag must match the manifest version, so a mistyped tag cannot
      # publish a version nobody meant to ship.
      - name: Check tag matches package version
        if: github.event_name != 'workflow_dispatch'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          REF="${{ github.event.release.tag_name || github.ref_name }}"
          echo "manifest=$VERSION tag=$REF"
          if [ "v$VERSION" != "$REF" ]; then
            echo "::error::tag $REF does not match package version v$VERSION"
            exit 1
          fi

      - run: npm run check
      - run: npm test

      # Both a tag push and a Release can reach this workflow, and a release is
      # usually created right after the tag. Publishing an existing version
      # fails, so detect it and skip instead of turning the run red.
      - name: Is this version already on npm?
        id: published
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-shortcuts-prompt@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "dsh-shortcuts-prompt@$VERSION is already published — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (trusted publishing)
        id: publish
        if: steps.published.outputs.skip != 'true'
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --provenance --access public --loglevel=verbose --dry-run 2>&1 | tee publisher.log
          else
            npm publish --provenance --access public --loglevel=verbose 2>&1 | tee publisher.log
          fi

      # Temporary diagnostic: GitHub keeps job logs behind authentication and the
      # page is client-rendered, so a failed publish copies its own output to a
      # branch we can read.
      - name: Push publish diagnostics
        if: always() && steps.published.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/diag
          cp publisher.log /tmp/diag/publish.log 2>/dev/null || true
          {
            echo
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "registry: $(npm config get registry)"
            echo "oidc endpoint present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
            echo "oidc request token present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
            echo "npm_config_provenance: ${npm_config_provenance:-unset}"
          } >> /tmp/diag/publish.log
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/diag/repo
          cd /tmp/diag/repo
          git checkout -B ci-diagnostics
          cp /tmp/diag/publish.log ci-publish.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-publish.log
          git commit -m "ci: publish diagnostics for run ${GITHUB_RUN_ID}"
          git push -f origin ci-diagnostics

      - name: Smoke-test the published version
        if: steps.publish.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            if npm view "dsh-shortcuts-prompt@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "published dsh-shortcuts-prompt@$VERSION"
              exit 0
            fi
            echo "waiting for the registry to index $VERSION (attempt $attempt)"
            sleep 6
          done
          echo "::error::the published version did not appear on the registry"
          exit 1
