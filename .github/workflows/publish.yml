name: Publish to npm

# Release-driven publishing: create a GitHub Release (or push a v* tag) and this
# workflow publishes the package with provenance.
#
# Authentication is npm *trusted publishing* (OIDC): no token, no OTP. It needs
# two things set up once, by hand:
#   1. the package exists (first publish done interactively with --otp);
#   2. npmjs.com → package → Settings → Trusted publishing → GitHub Actions,
#      with repository smithtomge-alt/dsh-shortcuts-prompt and workflow
#      publish.yml.
# Bypass-2FA granular tokens are being retired for direct publish, so a secret is
# deliberately not used here.

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish --dry-run instead of publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url: that writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc,
      # which conflicts with the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Guard: the tag must match the manifest version, so a mistyped tag cannot
      # publish a version nobody meant to ship.
      - name: Check tag matches package version
        if: github.event_name != 'workflow_dispatch'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          REF="${{ github.event.release.tag_name || github.ref_name }}"
          echo "manifest=$VERSION tag=$REF"
          if [ "v$VERSION" != "$REF" ]; then
            echo "::error::tag $REF does not match package version v$VERSION"
            exit 1
          fi

      - run: npm run check
      - run: npm test

      # Both a tag push and a Release can reach this workflow, and a release is
      # usually created right after the tag. Publishing an existing version
      # fails, so detect it and skip instead of turning the run red.
      - name: Is this version already on npm?
        id: published
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-shortcuts-prompt@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "dsh-shortcuts-prompt@$VERSION is already published — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (trusted publishing)
        id: publish
        if: steps.published.outputs.skip != 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi

      - name: Smoke-test the published version
        if: steps.publish.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 20); do
            if npm view "dsh-shortcuts-prompt@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "published dsh-shortcuts-prompt@$VERSION"
              exit 0
            fi
            echo "registry still processing $VERSION (attempt $attempt/20)"
            sleep 15
          done
          echo "::error::the published version did not appear on the registry within 5 minutes"
          exit 1
